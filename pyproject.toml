[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "thistlewarden"
version = "0.1.0"
description = "Local evaluator for OpenAI-compatible language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.3",
  "Flask==3.1.2",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pydantic==2.12.4",
  "python-dotenv==1.2.1",
  "regex==2026.9.29",
  "simplejson==3.20.2",
  "waitress==3.0.2",
]

[project.scripts]
thistlewarden = "evaluator.server:main"
thistlewarden-admin = "evaluator.cli:main"

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.14.5",
  "types-jsonschema==4.25.1.20251009",
  "types-regex==2026.9.29.20261030",
  "types-simplejson==3.20.0.20250822",
  "types-waitress==3.0.1.20260724",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evaluator" = ["templates/*.html", "static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: isolated unit tests",
  "integration: Flask and component integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true
