{% extends "base.html" %}{% block title %}Golden set importeren · Thistlewarden{% endblock %}{% block content %}<h1>Golden set importeren</h1><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Formaat<select name="format"><option value="json">JSON</option><option value="csv">CSV</option></select></label><label>Naam bij CSV<input name="name"></label><label class="wide">Bestand<input type="file" name="file" accept=".json,.csv" required></label><div class="actions wide"><button name="preview">Valideren en preview</button><button name="commit" class="secondary">Definitief importeren</button></div></form>{% if preview %}<section class="panel"><h2>Geldige preview</h2><dl><dt>Naam</dt><dd>{{ preview.name }}</dd><dt>Versie</dt><dd>{{ preview.version }}</dd><dt>Testcases</dt><dd>{{ preview.count }}</dd></dl></section>{% endif %}{% endblock %}
