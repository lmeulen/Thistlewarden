{% extends "base.html" %}{% block title %}Import golden set · Thistlewarden{% endblock %}{% block content %}<h1>Import golden set</h1><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Format<select name="format"><option value="json">JSON</option><option value="csv">CSV</option></select></label><label>Name for CSV<input name="name"></label><label class="wide">File<input type="file" name="file" accept=".json,.csv" required></label><div class="actions wide"><button name="preview">Validate and preview</button><button name="commit" class="secondary">Complete import</button></div></form>{% if preview %}<section class="panel"><h2>Valid preview</h2><dl><dt>Name</dt><dd>{{ preview.name }}</dd><dt>Version</dt><dd>{{ preview.version }}</dd><dt>Testcases</dt><dd>{{ preview.count }}</dd></dl></section>{% endif %}{% endblock %}
