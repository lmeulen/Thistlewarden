<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Thistlewarden{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<a class="skip" href="#inhoud">Naar inhoud</a>
<header><nav aria-label="Hoofdnavigatie"><a href="{{ url_for('gui.dashboard') }}">Overzicht</a><a href="{{ url_for('gui.settings_page') }}">Instellingen</a><a href="{{ url_for('gui.endpoints_page') }}">Endpoints en modellen</a><a href="{{ url_for('gui.runs_page') }}">Runs</a><a href="{{ url_for('gui.golden_sets_page') }}">Golden sets</a><a href="{{ url_for('gui.judges_page') }}">Judges</a><a href="{{ url_for('gui.configuration_page') }}">Configuratie</a></nav></header>
<main id="inhoud" tabindex="-1">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="message {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>Lokale single-user evaluator</footer>
<script nonce="{{ csp_nonce() }}">document.querySelectorAll('time[data-utc]').forEach(function(e){var d=new Date(e.dataset.utc);if(!isNaN(d)){e.textContent=d.toLocaleString('nl-NL')}});</script></body></html>
