{% extends "base.html" %}{% block title %}Judge profile · Thistlewarden{% endblock %}{% block content %}<h1>{{ 'Edit judge profile' if judge else 'Add judge profile' }}</h1>{% set d=judge.data if judge else none %}<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required value="{{ d.name if d else '' }}"></label><label>Model profile<select name="model_profile_id" required>{% for model in models %}<option value="{{ model.id }}" {% if d and d.model_profile_id==model.id %}selected{% endif %}>{{ model.data.display_name }} ({{ model.data.model_id }})</option>{% endfor %}</select></label><label>Template version<input name="template_version" value="{{ d.template_version if d else '1.0' }}"></label><label>Threshold<input type="number" step="any" min="0" max="1" name="threshold" value="{{ d.threshold if d else '0.7' }}"></label><label>Temperature<input type="number" step="any" min="0" name="temperature" value="{{ d.temperature if d else '0' }}"></label><label>Max. output tokens<input type="number" min="1" name="max_output_tokens" value="{{ d.max_output_tokens or '' if d else '' }}"></label><label class="wide">Prompt template<textarea name="prompt_template" rows="7" required>{{ d.prompt_template if d else 'judge-v1' }}</textarea></label><label class="wide">Rubric: id|weight|description<textarea name="rubric" rows="9" required>{% if d %}{% for r in d.rubric %}{{ r.id }}|{{ r.weight }}|{{ r.description }}{{ '\n' if not loop.last }}{% endfor %}{% else %}factual_correctness|1|Factual correctness.
completeness|1|Completeness.
relevance|1|Relevance.
instruction_compliance|1|Compliance with explicit instructions.
consistency|1|No contradictions.{% endif %}</textarea></label><label class="check"><input type="checkbox" name="is_global_default" {% if d and d.is_global_default %}checked{% endif %}> Global default</label><label class="check"><input type="checkbox" name="active" {% if not d or d.active %}checked{% endif %}> Active</label><div class="actions wide"><button>Save</button><a href="{{ url_for('gui.judges_page') }}">Back</a></div></form>{% endblock %}
