{% extends "base.html" %}{% block title %}Judgeprofiel · Thistlewarden{% endblock %}{% block content %}<h1>{{ 'Judgeprofiel bewerken' if judge else 'Judgeprofiel toevoegen' }}</h1>{% set d=judge.data if judge else none %}<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Naam<input name="name" required value="{{ d.name if d else '' }}"></label><label>Modelprofiel<select name="model_profile_id" required>{% for model in models %}<option value="{{ model.id }}" {% if d and d.model_profile_id==model.id %}selected{% endif %}>{{ model.data.display_name }} ({{ model.data.model_id }})</option>{% endfor %}</select></label><label>Templateversie<input name="template_version" value="{{ d.template_version if d else '1.0' }}"></label><label>Threshold<input type="number" step="any" min="0" max="1" name="threshold" value="{{ d.threshold if d else '0.7' }}"></label><label>Temperatuur<input type="number" step="any" min="0" name="temperature" value="{{ d.temperature if d else '0' }}"></label><label>Max. outputtokens<input type="number" min="1" name="max_output_tokens" value="{{ d.max_output_tokens or '' if d else '' }}"></label><label class="wide">Prompttemplate<textarea name="prompt_template" rows="7" required>{{ d.prompt_template if d else 'judge-v1' }}</textarea></label><label class="wide">Rubric: id|gewicht|beschrijving<textarea name="rubric" rows="9" required>{% if d %}{% for r in d.rubric %}{{ r.id }}|{{ r.weight }}|{{ r.description }}{{ '\n' if not loop.last }}{% endfor %}{% else %}factual_correctness|1|Feitelijke juistheid.
completeness|1|Volledigheid.
relevance|1|Relevantie.
instruction_compliance|1|Naleving van expliciete instructies.
consistency|1|Geen tegenstrijdigheden.{% endif %}</textarea></label><label class="check"><input type="checkbox" name="is_global_default" {% if d and d.is_global_default %}checked{% endif %}> Globale standaard</label><label class="check"><input type="checkbox" name="active" {% if not d or d.active %}checked{% endif %}> Actief</label><div class="actions wide"><button>Opslaan</button><a href="{{ url_for('gui.judges_page') }}">Terug</a></div></form>{% endblock %}
