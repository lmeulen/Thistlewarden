name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -q tests/unit tests/integration

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release environment
        shell: bash
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          import base64, secrets
          path = Path('.env')
          text = path.read_text()
          text = text.replace('replace-with-base64-encoded-32-random-bytes', base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          text = text.replace('replace-with-a-long-random-value', secrets.token_urlsafe(48))
          path.write_text(text)
          PY
      - run: docker compose -f compose.yaml -f compose.e2e.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.e2e.yaml build --pull
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait
      - run: python scripts/e2e_release.py
      - name: Preserve runtime logs
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color > compose.log
      - name: Scan logs for fixture secret
        if: always()
        run: '! grep -F "release-fixture-secret" compose.log'
      - name: Shutdown
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
