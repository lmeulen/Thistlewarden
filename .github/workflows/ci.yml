name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Verify wheel and source distribution manual content
        run: |
          python -m build --wheel --sdist --outdir dist
          python scripts/verify_manual_artifacts.py \
            --wheel dist/thistlewarden-*.whl \
            --sdist dist/thistlewarden-*.tar.gz
          python -m venv /tmp/thistlewarden-wheel
          /tmp/thistlewarden-wheel/bin/python -m pip install dist/thistlewarden-*.whl
          cd /tmp
          /tmp/thistlewarden-wheel/bin/python - <<'PY'
          from evaluator.manual import manual_asset, manual_pages, render_manual_page
          assert "dashboard" in manual_pages()
          assert "Thistlewarden User Manual" in str(render_manual_page("index"))
          assert manual_asset("dashboard.png").startswith(b"\x89PNG")
          PY
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - name: Test with branch coverage
        run: >-
          python -m pytest -q tests/unit tests/integration
          --junitxml=junit.xml
          -o junit_logging=no
          -o junit_log_passing_tests=false
          --cov=evaluator --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("junit.xml")
          print("## Pytest results")
          if not report.is_file():
              print("Pytest did not produce JUnit XML; inspect preceding workflow steps.")
              raise SystemExit()
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          outer = suites[0]
          tests = int(outer.get("tests", "0"))
          failures = int(outer.get("failures", "0"))
          errors = int(outer.get("errors", "0"))
          skipped = int(outer.get("skipped", "0"))
          print(f"{tests} tests: {tests - failures - errors - skipped} passed, "
                f"{failures} failed, {errors} errors, {skipped} skipped.")
          problems = [case for case in root.iter("testcase")
                      if case.find("failure") is not None or case.find("error") is not None]
          if problems:
              print("\n### Failures and errors")
              for case in problems:
                  detail = case.find("failure")
                  if detail is None:
                      detail = case.find("error")
                  message = (detail.get("message", "") if detail is not None else "").splitlines()[0]
                  name = f"{case.get('classname', '')}.{case.get('name', '')}".strip(".")
                  print(f"- `{name}`: {message or 'See raw JUnit artifact.'}")
          PY
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-junit-${{ github.run_id }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
      # Trusted runs use CODECOV_TOKEN when configured. Fork pull requests receive no secret
      # and use Codecov's public tokenless path. Reporting stays non-blocking because Pytest is
      # the quality gate and a third-party outage must not replace or hide its exit status.
      - name: Publish coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: pytest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: false

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release environment
        shell: bash
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          import base64, secrets
          path = Path('.env')
          text = path.read_text()
          text = text.replace('replace-with-base64-encoded-32-random-bytes', base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          text = text.replace('replace-with-a-long-random-value', secrets.token_urlsafe(48))
          path.write_text(text)
          PY
      - run: docker compose -f compose.yaml -f compose.e2e.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.e2e.yaml build --pull
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait
      - run: python scripts/e2e_release.py
      - name: Preserve runtime logs
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color > compose.log
      - name: Scan logs for fixture secret
        if: always()
        run: '! grep -F "release-fixture-secret" compose.log'
      - name: Shutdown
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
